[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deul"
version = "0.1.0"
description = "Drift-Aware Experience Utility Learning for Long-Horizon Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]
figures = ["matplotlib", "pandas"]

[tool.setuptools.packages.find]
include = ["deul*"]
